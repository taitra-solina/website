<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB公司資料治理 — 專案進度報告 2026/05/22</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --white:#FFFFFF; --bg:#F5F6FA; --bg-card:#FFFFFF;
      --orange:#E85D04; --orange-dark:#C44D03; --orange-light:#FFF1E8; --orange-soft:#FFD6BA;
      --deep-blue:#1B2A4A; --navy:#253B6E; --muted-blue:#4A6FA5;
      --light-blue:#E8EEF6; --pale-blue:#D6E4F0; --golden:#E6940A;
      --text-primary:#1A1A2E; --text-body:#2D3748; --text-secondary:#4A5568; --text-muted:#718096;
      --border:#E2E8F0; --border-light:#EDF2F7;
      --green:#059669; --green-light:#ECFDF5;
      --red:#DC2626; --red-light:#FEF2F2;
      --yellow:#D69E2E; --yellow-light:#FEFCE8;
      --sidebar-w:220px;
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:100px;
      --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
      --shadow-md:0 4px 14px rgba(0,0,0,0.08);
      --shadow-lg:0 10px 30px rgba(0,0,0,0.10);
      --font:'Noto Sans TC','Inter',-apple-system,sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;font-size:24px;scroll-snap-type:y mandatory}
    body{font-family:var(--font);background:var(--bg);color:var(--text-body);line-height:1.8;-webkit-font-smoothing:antialiased}
    #scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--golden));z-index:9999;transition:width 0.15s}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--deep-blue);z-index:1000;display:flex;flex-direction:column;padding:32px 0;overflow-y:auto}
    .sidebar-logo{padding:0 24px;margin-bottom:36px;font-size:0.85rem;font-weight:800;color:var(--orange);letter-spacing:0.04em}
    .sidebar-logo span{color:rgba(255,255,255,0.5);font-weight:400}
    .nav-list{display:flex;flex-direction:column;gap:2px;padding:0 12px}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:0.82rem;font-weight:500;color:rgba(255,255,255,0.55);border-radius:var(--radius-sm);cursor:pointer;border:none;background:none;font-family:var(--font);transition:all 0.2s;text-align:left;width:100%}
    .nav-link:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.06)}
    .nav-link.active{color:#fff;background:rgba(255,255,255,0.1);font-weight:700;border-left:3px solid var(--orange)}
    .nav-num{font-size:0.72rem;font-weight:700;opacity:0.5;min-width:18px}
    .main{margin-left:var(--sidebar-w)}
    .page-wrap{max-width:1050px;margin:0 auto;padding:0 40px;width:100%}
    section{padding:80px 0;min-height:100vh;scroll-snap-align:start;display:flex;align-items:center}
    .hero{min-height:100vh;display:flex;align-items:center;background:linear-gradient(135deg,var(--deep-blue) 0%,var(--navy) 100%);position:relative;overflow:hidden;padding:0}
    .hero::before{content:'';position:absolute;top:-150px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(232,93,4,0.15) 0%,transparent 70%);border-radius:50%}
    .hero-content{position:relative;z-index:1}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(232,93,4,0.15);color:var(--orange);font-size:0.82rem;font-weight:700;border-radius:var(--radius-pill);margin-bottom:28px;border:1px solid rgba(232,93,4,0.25)}
    .hero-badge::before{content:'';width:8px;height:8px;background:var(--orange);border-radius:50%}
    .hero h1{font-size:2.8rem;font-weight:900;line-height:1.25;color:#fff;margin-bottom:20px;letter-spacing:-0.02em}
    .hero h1 .accent{color:var(--orange)}
    .hero-sub{font-size:1rem;color:rgba(255,255,255,0.65);max-width:580px;line-height:1.9;margin-bottom:32px}
    .hero-meta{display:flex;gap:24px;font-size:0.85rem;color:rgba(255,255,255,0.4)}
    .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
    .hero-stat{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);padding:20px 24px}
    .hero-stat-num{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-0.03em}
    .hero-stat-label{font-size:0.78rem;color:rgba(255,255,255,0.5);margin-top:4px}
    .section-head{margin-bottom:32px}
    .section-num{font-size:0.75rem;font-weight:700;color:var(--orange);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
    .section-title{font-size:1.8rem;font-weight:800;color:var(--text-primary);letter-spacing:-0.02em;line-height:1.3}
    .section-subtitle{font-size:0.95rem;color:var(--text-secondary);margin-top:6px;line-height:1.7}
    .card{background:var(--bg-card);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:box-shadow 0.3s,transform 0.3s}

    .stats-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    .stat-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;border:1px solid var(--border);transition:box-shadow 0.3s,transform 0.3s}
    .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
    .stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
    .stat-card--orange::before{background:var(--orange)}
    .stat-card--blue::before{background:var(--navy)}
    .stat-card--green::before{background:var(--green)}
    .stat-card--golden::before{background:var(--golden)}
    .stat-card--red::before{background:var(--red)}
    .stat-label{font-size:0.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
    .stat-num{font-size:2rem;font-weight:900;letter-spacing:-0.03em;color:var(--text-primary);line-height:1.1}
    .stat-note{font-size:0.78rem;color:var(--text-muted);margin-top:8px}
    .data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:0.85rem}
    .data-table th{text-align:left;padding:12px 14px;font-weight:700;color:var(--text-secondary);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid var(--border);background:var(--bg)}
    .data-table td{padding:12px 14px;border-bottom:1px solid var(--border-light);color:var(--text-body)}
    .data-table tbody tr:hover{background:var(--bg)}
    .badge{display:inline-block;padding:3px 10px;font-size:0.75rem;font-weight:700;border-radius:var(--radius-pill)}
    .badge--good{background:var(--green-light);color:var(--green)}
    .badge--warn{background:var(--yellow-light);color:var(--yellow)}
    .badge--critical{background:var(--red-light);color:var(--red)}
    .badge--primary{background:var(--orange-light);color:var(--orange)}
    .badge--blue{background:var(--light-blue);color:var(--navy)}
    .badge--done{background:#f0fdf4;color:#166534}
    .bar-chart{display:flex;flex-direction:column;gap:12px}
    .bar-row{display:grid;grid-template-columns:230px 1fr 90px;align-items:center;gap:12px;font-size:0.82rem}
    .bar-label{color:var(--text-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{height:28px;background:var(--bg);border-radius:var(--radius-pill);overflow:hidden}
    .bar-fill{height:100%;border-radius:var(--radius-pill);transition:width 1.2s cubic-bezier(0.22,1,0.36,1);min-width:4px}
    .bar-fill--orange{background:linear-gradient(90deg,var(--orange),var(--golden))}
    .bar-fill--blue{background:linear-gradient(90deg,var(--navy),var(--muted-blue))}
    .bar-fill--green{background:linear-gradient(90deg,var(--green),#34d399)}
    .bar-fill--red{background:linear-gradient(90deg,var(--red),#f87171)}
    .bar-value{font-weight:800;color:var(--text-primary);text-align:right;font-variant-numeric:tabular-nums}
    .callout{padding:20px 24px;border-radius:var(--radius-md);border-left:4px solid;margin:20px 0}
    .callout--orange{background:var(--orange-light);border-color:var(--orange)}
    .callout--blue{background:var(--light-blue);border-color:var(--navy)}
    .callout--green{background:var(--green-light);border-color:var(--green)}
    .callout--red{background:var(--red-light);border-color:var(--red)}
    .callout--golden{background:var(--yellow-light);border-color:var(--golden)}
    .callout-title{font-size:0.88rem;font-weight:700;margin-bottom:6px}
    .callout-body{font-size:0.88rem;line-height:1.8}
    .highlight-section{background:var(--deep-blue);padding:80px 0}
    .highlight-section .section-num{color:var(--golden)}
    .highlight-section .section-title{color:#fff}
    .highlight-section .section-subtitle{color:rgba(255,255,255,0.6)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
    .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
    .step-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border);position:relative}
    .step-num{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.88rem;font-weight:800;margin-bottom:16px}
    .step-card--blue .step-num{background:var(--navy)}
    .step-card--green .step-num{background:var(--green)}
    .step-title{font-size:0.95rem;font-weight:700;color:var(--text-primary);margin-bottom:8px}
    .step-body{font-size:0.85rem;color:var(--text-body);line-height:1.8}
    .closing{padding:80px 0;min-height:80vh;display:flex;align-items:center}
    .closing-text{font-size:1.6rem;font-weight:800;color:var(--text-primary);line-height:1.5;text-align:center}
    .hl{color:var(--orange)}
    .back-to-top{position:fixed;bottom:32px;right:32px;width:46px;height:46px;border-radius:50%;background:var(--orange);color:white;border:none;cursor:pointer;font-size:1.2rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(20px);transition:all 0.3s;z-index:999}
    .back-to-top.visible{opacity:1;transform:translateY(0)}
    .back-to-top:hover{background:var(--navy)}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity 0.6s ease,transform 0.6s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}
    .footer{padding:32px 0;text-align:center;font-size:0.78rem;color:var(--text-muted);border-top:1px solid var(--border)}
    .tag-chip{display:inline-block;padding:4px 12px;border-radius:var(--radius-pill);font-size:0.75rem;font-weight:700;margin-right:6px;margin-bottom:4px}
    .tag-chip--orange{background:var(--orange-light);color:var(--orange)}
    .tag-chip--blue{background:var(--light-blue);color:var(--navy)}
    .tag-chip--green{background:var(--green-light);color:var(--green)}
    .tag-chip--golden{background:var(--yellow-light);color:var(--yellow)}
    .timeline{position:relative;padding-left:24px}
    .timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
    .tl-item{position:relative;margin-bottom:24px}
    .tl-dot{position:absolute;left:-24px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--orange);border:2px solid var(--white);box-shadow:0 0 0 2px var(--orange)}
    .tl-dot--green{background:var(--green);box-shadow:0 0 0 2px var(--green)}
    .tl-dot--blue{background:var(--navy);box-shadow:0 0 0 2px var(--navy)}
    .tl-dot--golden{background:var(--golden);box-shadow:0 0 0 2px var(--golden)}
    .tl-date{font-size:0.75rem;font-weight:700;color:var(--orange);margin-bottom:4px;letter-spacing:0.05em}
    .tl-date--green{color:var(--green)}
    .tl-date--blue{color:var(--navy)}
    .tl-date--golden{color:var(--golden)}
    .tl-text{font-size:0.88rem;color:var(--text-body);line-height:1.7}
    .progress-ring{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;padding:20px 0}
    .chart-wrap{text-align:center}
    .chart-label{font-size:0.8rem;color:var(--text-secondary);margin-top:8px}
    .golden-cross-wrap{background:var(--bg-card);border-radius:var(--radius-lg);padding:20px 28px 18px;border:1px solid var(--border);width:100%;margin:0 auto}
    .chart-title{font-size:0.95rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px;text-align:center;letter-spacing:0.05em;text-transform:uppercase}
    .legend{display:flex;justify-content:center;gap:32px;margin-top:8px;font-size:0.85rem;color:var(--text-body)}
    .legend-item{display:flex;align-items:center;gap:8px}
    .legend-line{width:28px;height:4px;border-radius:2px;display:inline-block}
    @media(max-width:900px){
      .sidebar{display:none}
      .main{margin-left:0}
      .two-col,.three-col{grid-template-columns:1fr}
      .hero-stats{grid-template-columns:1fr 1fr}
      .bar-row{grid-template-columns:120px 1fr 70px}
      section{padding:60px 0}
    }
  </style>
</head>
<body>
  <div id="scroll-progress"></div>
  <div id="root"></div>
  <script type="text/babel">
















const { useState, useEffect, useRef } = React;

const fmt = n => n.toLocaleString('en-US');

function useReveal(th = 0.15) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVis(true); obs.disconnect(); }
    }, { threshold: th });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function Reveal({ children, delay = 0, className = '' }) {
  const [ref, vis] = useReveal();
  return (
    <div ref={ref} className={`reveal ${vis ? 'visible' : ''} ${className}`}
      style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

function Counter({ end, duration = 1800, suffix = '' }) {
  const [val, setVal] = useState(0);
  const [ref, vis] = useReveal();
  useEffect(() => {
    if (!vis) return;
    const st = performance.now();
    const tick = now => {
      const p = Math.min((now - st) / duration, 1);
      setVal(Math.round((1 - Math.pow(1 - p, 3)) * end));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [vis, end]);
  return <span ref={ref}>{fmt(val)}{suffix}</span>;
}

function AnimBar({ width, color = 'orange' }) {
  const [ref, vis] = useReveal(0.1);
  return (
    <div className="bar-track" ref={ref}>
      <div className={`bar-fill bar-fill--${color}`}
        style={{ width: vis ? `${width}%` : '0%' }} />
    </div>
  );
}

function GoldenCrossChart() {
  const [ref, vis] = useReveal(0.1);
  const [animated, setAnimated] = useState(false);
  useEffect(() => {
    if (vis) setTimeout(() => setAnimated(true), 300);
  }, [vis]);

  // SVG layout
  const W = 580, H = 270;
  const pL = 72, pR = 64, pT = 30, pB = 48;
  const cW = W - pL - pR, cH = H - pT - pB;
  const maxY = 250000;

  const toX = p => pL + p * cW;
  const toY = v => pT + cH - (v / maxY) * cH;

  // Two data series: [proportion_along_x, value]
  const dup  = [[0, 237990], [1, 56862]];
  const cln  = [[0, 64530],  [1, 84938]];

  const pts = arr => arr.map(([p, v]) => [toX(p), toY(v)]);
  const dupPts = pts(dup);
  const clnPts = pts(cln);
  const pathD = p => `M ${p[0][0]},${p[0][1]} L ${p[1][0]},${p[1][1]}`;

  // Path lengths for stroke-dashoffset animation
  const dL = Math.sqrt(Math.pow(dupPts[1][0]-dupPts[0][0],2)+Math.pow(dupPts[1][1]-dupPts[0][1],2)).toFixed(0);
  const cL = Math.sqrt(Math.pow(clnPts[1][0]-clnPts[0][0],2)+Math.pow(clnPts[1][1]-clnPts[0][1],2)).toFixed(0);

  // Cross point: x≈454, y≈159 (pre-calculated)
  const cx = 454, cy = 159;

  const gridYs = [0, 50000, 100000, 150000, 200000, 250000];

  return (
    <div ref={ref} className="golden-cross-wrap">
      <div className="chart-title">黃金交會點：資料純度大幅提升</div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}}>
        {/* Grid */}
        {gridYs.map(v => {
          const y = toY(v);
          return (
            <g key={v}>
              <line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#E2E8F0" strokeWidth="1"/>
              <text x={pL-6} y={y+4} textAnchor="end" fontSize="10" fill="#718096" fontFamily="Inter">
                {v===0?'0':`${v/1000}K`}
              </text>
            </g>
          );
        })}
        {/* X axis */}
        <line x1={pL} y1={H-pB} x2={W-pR} y2={H-pB} stroke="#CBD5E0" strokeWidth="1.5"/>
        <text x={toX(0)} y={H-pB+18} textAnchor="middle" fontSize="11" fill="#4A5568" fontWeight="700" fontFamily="Inter">4/17</text>
        <text x={toX(1)} y={H-pB+18} textAnchor="middle" fontSize="11" fill="#4A5568" fontWeight="700" fontFamily="Inter">5/20</text>
        {/* Cross vertical line */}
        <line x1={cx} y1={pT} x2={cx} y2={H-pB} stroke="#E6940A" strokeWidth="1.5" strokeDasharray="5 3" opacity="0.8"/>
        {/* Dup line */}
        <path d={pathD(dupPts)} fill="none" stroke="#DC2626" strokeWidth="3" strokeLinecap="round"
          strokeDasharray={dL} strokeDashoffset={animated ? '0' : dL}
          style={{transition:'stroke-dashoffset 1.6s ease-out'}}/>
        {/* Clean line */}
        <path d={pathD(clnPts)} fill="none" stroke="#059669" strokeWidth="3" strokeLinecap="round"
          strokeDasharray={cL} strokeDashoffset={animated ? '0' : cL}
          style={{transition:'stroke-dashoffset 1.6s ease-out 0.4s'}}/>
        {/* Shaded area between lines (before) — 無效雜訊區 */}
        <polygon
          points={`${dupPts[0][0]},${dupPts[0][1]} ${cx},${cy} ${clnPts[0][0]},${clnPts[0][1]}`}
          fill="rgba(220,38,38,0.14)" stroke="none"/>
        {/* Shaded area between lines (after) — 品質淨化區 */}
        <polygon
          points={`${cx},${cy} ${dupPts[1][0]},${dupPts[1][1]} ${clnPts[1][0]},${clnPts[1][1]}`}
          fill="rgba(5,150,105,0.14)" stroke="none"/>
        {/* Zone label — left (資料干擾區) */}
        <text x={199} y={128} textAnchor="middle" fontSize="12" fontWeight="800" fill="#B91C1C" fontFamily="Inter,Noto Sans TC">資料干擾區</text>
        {/* Zone label — right (品質淨化區) */}
        <text x={483} y={168} textAnchor="middle" fontSize="9" fontWeight="800" fill="#047857" fontFamily="Inter,Noto Sans TC">品質淨化區</text>
        {/* Points */}
        {dupPts.map(([x,y],i) => <circle key={i} cx={x} cy={y} r="6" fill="#DC2626" stroke="#fff" strokeWidth="2"/>)}
        {clnPts.map(([x,y],i) => <circle key={i} cx={x} cy={y} r="6" fill="#059669" stroke="#fff" strokeWidth="2"/>)}
        {/* Value labels (移至圖內避免被遮擋) */}
        <text x={dupPts[0][0]+6} y={dupPts[0][1]-10} textAnchor="start" fontSize="11" fill="#DC2626" fontWeight="700" fontFamily="Inter">237,990</text>
        <text x={dupPts[1][0]+6} y={dupPts[1][1]+4} textAnchor="start" fontSize="11" fill="#DC2626" fontWeight="700" fontFamily="Inter">56,862</text>
        <text x={clnPts[0][0]+10} y={clnPts[0][1]+18} textAnchor="start" fontSize="11" fill="#059669" fontWeight="700" fontFamily="Inter">64,530</text>
        <text x={clnPts[1][0]+6} y={clnPts[1][1]+4} textAnchor="start" fontSize="11" fill="#059669" fontWeight="700" fontFamily="Inter">84,936</text>
        {/* Pivot point highlight */}
        <circle cx={cx} cy={cy} r="13" fill="rgba(230,148,10,0.18)" stroke="#E6940A" strokeWidth="2"/>
        <circle cx={cx} cy={cy} r="5" fill="#E6940A"/>
        <text x={cx} y={cy-18} textAnchor="middle" fontSize="12" fill="#B45309" fontWeight="800" fontFamily="Inter,Noto Sans TC">品質翻轉點</text>
      </svg>
      <div className="legend">
        <div className="legend-item">
          <span className="legend-line" style={{background:'#DC2626'}}></span>重複公司數
        </div>
        <div className="legend-item">

function Sidebar() {
  const [active, setActive] = useState(0);
  const nav = ['首頁','資料唯一性','資料完整性','監控報表','請示項目'];
  const navIds = ['sec-hero','sec-dedupe','sec-challenge','sec-report','sec-next'];
  const ids = ['sec-hero','sec-dedupe','sec-challenge','sec-challenge-tools','sec-report','sec-next'];

  useEffect(() => {
    const handleScroll = () => {
      const prog = document.getElementById('scroll-progress');
      if (prog) {
        const pct = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
        prog.style.width = `${pct}%`;
      }
      const scrollY = window.scrollY + window.innerHeight * 0.35;
      for (let i = ids.length - 1; i >= 0; i--) {
        const el = document.getElementById(ids[i]);
        if (el) {
          const top = el.getBoundingClientRect().top + window.scrollY;
          if (top <= scrollY) {
            const navKey = ids[i] === 'sec-challenge-tools' ? 'sec-challenge' : ids[i];
            const idx = navIds.indexOf(navKey);
            if (idx >= 0) setActive(idx);
            break;
          }
        }
      }
    };
    const handleKey = (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'PageDown' && e.key !== 'PageUp') return;
      const tag = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable)) return;
      const dir = (e.key === 'ArrowDown' || e.key === 'PageDown') ? 1 : -1;
      const y = window.scrollY;
      const tops = ids.map(id => {
        const el = document.getElementById(id);
        return el ? el.getBoundingClientRect().top + window.scrollY : null;
      }).filter(v => v !== null).sort((a,b) => a-b);
      let target = null;
      if (dir === 1) {
        target = tops.find(t => t > y + 10);
      } else {
        for (let i = tops.length - 1; i >= 0; i--) {
          if (tops[i] < y - 10) { target = tops[i]; break; }
        }
      }
      if (target != null) {
        e.preventDefault();
        window.scrollTo({ top: target, behavior: 'smooth' });
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    window.addEventListener('keydown', handleKey);
    return () => {
      window.removeEventListener('scroll', handleScroll);
      window.removeEventListener('keydown', handleKey);
    };
  }, []);

  const scrollTo = id => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  };

  return (
    <nav className="sidebar">
      <div className="sidebar-logo">TAITRA DG<br/><span></span></div>
      <div className="nav-list">
        {nav.map((label, i) => (
          <button key={i} className={`nav-link ${active===i?'active':''}`}
            onClick={() => scrollTo(navIds[i])}>
            <span className="nav-num">0{i+1}</span>{label}
          </button>
        ))}
      </div>
    </nav>
  );
}

function BackToTop() {
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const h = () => setVis(window.scrollY > 600);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <button className={`back-to-top ${vis?'visible':''}`}
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>↑</button>
  );
}

              },

              <li key={i} style={{display:'flex',gap:'22px',alignItems:'flex-start',paddingLeft:'18px',borderLeft:`3px solid ${accent}`}}>
                <span style={{
                  flexShrink:0,fontSize:'1.7rem',fontWeight:900,color:accent,
                  lineHeight:1,minWidth:'1.8rem',textAlign:'center',
                  fontFamily:'"Noto Sans TC",sans-serif',marginTop:'2px'
                }}>{num}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,color:'#fff',fontSize:'1.05rem',lineHeight:1.5,marginBottom:'8px'}}>{title}</div>
                  <div style={{fontSize:'0.9rem',color:'rgba(255,255,255,0.78)',lineHeight:1.85}}>{body}</div>
                </div>
              </li>
            ))}
          </ol>
        </Reveal>


      </div>
    </section>
  );
}
